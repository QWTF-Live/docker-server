name: docker-server

# Three services, not seven. The five game shards, the updater and the crash
# reporter are all built from our own repos and released together, so they run
# as one image with s6 supervising them; see qwtfsv/shards.conf for the shard
# list and qwtfsv/bin/tf-shard for what each one is handed.
#
# What deliberately stays separate:
#   certbot  upstream's image, so ACME and TLS fixes arrive with a pull instead
#            of waiting on a rebuild of ours
#   qwfwd    not built from any repo here; we only ever pull it
#
# Console access is `docker exec -it docker-server-fortressone-1 console`,
# which opens a tmux window per shard. `docker attach` cannot work with five
# servers behind one stdin.

services:
  fortressone:
    image: qwtflive/fortressone:latest
    network_mode: host
    stdin_open: true
    tty: true
    restart: always
    environment:
      - TF_IP
      - TF_HOSTNAME
      - TF_RCON_PASSWORD
      - TF_ADMINPWD
      - TF_PASSWORD
      - TF_DISCORD_CHANNEL_ID
      - TF_REGION
      - TF_DOMAIN
      - TFL_HOST
      - TFL_MTU
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - S3_DEMO_URI
      - CF_EMAIL
      - CF_TOKEN
      - CF_ZONE
      - DISCORD_WEBHOOK_URL
    volumes:
      # One volume for everything that has to outlive a deploy: the shard
      # homedirs (demos, stats, logs, cores), the dats the updater syncs, and
      # the map/asset tree. Replaces the thirteen named volumes this file used
      # to need to pass files between the updater and the servers - in one
      # container that is just a directory.
      - tf-data:/srv
      - letsencrypt:/certs:ro

  qwfwd:
    image: fortressone/qwfwd:latest
    network_mode: host
    stdin_open: true
    tty: true
    restart: always
    command: |
      30000 0.0.0.0
      +set hostname "${TF_HOSTNAME} QWfwd"

  certbot:
    image: certbot/dns-cloudflare:latest
    restart: always
    environment:
      - TF_IP
      - CF_EMAIL
    volumes:
      - letsencrypt:/etc/letsencrypt
      - ./cloudflare.ini:/cloudflare.ini:ro
    # http-01 is not available: the game hosts have no inbound port 80, so
    # dns-01 through Cloudflare it is. Renewal is a no-op until the certificate
    # is inside its window, so a twice-daily pass costs nothing and needs no
    # scheduler of its own.
    #
    # Nothing here restarts the servers - FTE reads the pem once at startup and
    # has no reload command. The certwatch service inside the fortressone
    # container notices the new certificate and restarts each shard as it
    # empties out, which is a judgement only something in that container can
    # make. $$ escapes compose interpolation so the shell expands these.
    entrypoint: ["/bin/sh", "-c"]
    # A one-element list, not a bare string: compose word-splits a plain
    # string command, which would hand /bin/sh -c just the word "while".
    command:
      - |
        while :; do
          if [ ! -s "/etc/letsencrypt/live/$$TF_IP/fullchain.pem" ]; then
            echo "certbot: no certificate for $$TF_IP yet, requesting one"
            certbot certonly --non-interactive --agree-tos \
              --email "$$CF_EMAIL" \
              --domain "$$TF_IP" \
              --dns-cloudflare \
              --dns-cloudflare-credentials /cloudflare.ini \
              --dns-cloudflare-propagation-seconds 30 \
              || echo "certbot: issuance failed; retrying in 12h"
          else
            certbot renew --quiet || echo "certbot: renewal failed; retrying in 12h"
          fi
          sleep 12h
        done

volumes:
  tf-data:
  letsencrypt:
